name: Release

on:
  push:
    branches:
      - "main"
      - "yu_*"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # 非 tag 运行（分支推送 / 手动触发）：只构建并上传产物，不创建 Release
      - name: Build app (universal .app / .dmg)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pnpm tauri build --target universal-apple-darwin --config src-tauri/tauri.macos.conf.json

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: whalito-macos-universal-dmg
          path: src-tauri/target/**/bundle/dmg/*.dmg
          if-no-files-found: error

      # tag 运行：构建并发布到 GitHub Release
      # 内部分发：ad-hoc 签名（未公证），用户首次打开需右键 → 打开。
      # 未来正式分发：设置 APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
      # APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID 即可。
      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        run: node .github/release-notes.js

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Whalito ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          args: --target universal-apple-darwin --config src-tauri/tauri.macos.conf.json

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # 非 tag 运行（分支推送 / 手动触发）：只构建并上传产物，不创建 Release
      - name: Build app (NSIS)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pnpm tauri build

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: whalito-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # tag 运行：构建并发布到 GitHub Release
      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        run: node .github/release-notes.js

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Whalito ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
